<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03060b">
<title>DaNikeAI — Advanced Orb</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
 background:radial-gradient(ellipse at 50% 48%,#142334 0%,#080d15 38%,#020408 78%);
 color:#d9efff;font-family:system-ui,sans-serif
}
.stage{height:100%;height:100dvh;display:grid;place-items:center;position:relative;overflow:hidden}
.ambient{position:absolute;width:90vw;max-width:600px;aspect-ratio:1;border-radius:50%;background:#1679b51a;filter:blur(38px);animation:breath 5s ease-in-out infinite}
.unit{position:relative;width:min(88vw,470px);aspect-ratio:1;animation:float 5s ease-in-out infinite;isolation:isolate}
.core{
 position:absolute;left:25%;top:25%;width:50%;height:50%;border-radius:50%;
 background:
  radial-gradient(ellipse at 31% 22%,#a7b9c7 0,#596b79 7%,transparent 22%),
  radial-gradient(ellipse at 35% 32%,#4d5b68 0,#273440 26%,#101720 56%,#03060b 83%);
 border:2px solid #758b9b66;
 box-shadow:inset 8px 8px 14px #e6f5ff18,inset -18px -20px 28px #000e,0 0 30px #188bd51a;
 z-index:2
}
.core:before{
 content:"";position:absolute;inset:5%;border-radius:50%;
 border:1px solid #b4d4e526;
 background:repeating-linear-gradient(120deg,transparent 0 15px,#b6d9ed08 16px 17px);
}
.plate{
 position:absolute;inset:13%;border-radius:50%;border:1px solid #9db5c533;
 box-shadow:inset 0 0 12px #0009;
}
.plate:before,.plate:after{
 content:"";position:absolute;width:17%;height:9%;background:linear-gradient(#5d6c78,#151c25);
 border:1px solid #8da5b444;border-radius:3px;left:41%;
}
.plate:before{top:3%}.plate:after{bottom:3%}
.seam{
 position:absolute;z-index:5;left:8%;right:8%;top:49%;height:2px;
 background:linear-gradient(90deg,transparent,#318dc2,#c6f2ff,#fff,#c6f2ff,#318dc2,transparent);
 box-shadow:0 0 7px #6ed5ff,0 0 18px #168eea66;
 transition:.3s
}
.seam:after{content:"";position:absolute;inset:-5px 20%;background:#62caff30;filter:blur(6px)}
.orbit{
 position:absolute;left:50%;top:50%;width:94%;height:36%;
 border:1px solid #57b9ed9c;border-radius:50%;
 transform:translate(-50%,-50%) rotate(-34deg);
 box-shadow:0 0 10px #249ee41c;
 animation:spin 7s linear infinite;z-index:4
}
.orbit:before,.orbit:after{
 content:"";position:absolute;width:9px;height:9px;border-radius:50%;
 background:radial-gradient(circle at 30% 25%,#e6fbff,#43a8e9 55%,#142d40);
 border:1px solid #9ee6ff;box-shadow:0 0 12px #39b9ff
}
.orbit:before{left:13%;top:9%}.orbit:after{right:10%;bottom:7%;width:5px;height:5px}
.orbit.b{width:110%;height:55%;transform:translate(-50%,-50%) rotate(56deg);border-color:#68b9e65c;animation:reverse 11s linear infinite}
.orbit.c{width:116%;height:25%;transform:translate(-50%,-50%) rotate(72deg);border-color:#438acb72;animation:spin 15s linear infinite}
.orbit.d{width:80%;height:70%;transform:translate(-50%,-50%) rotate(20deg);border-color:#a0d7ed32;animation:reverse 18s linear infinite}
.arm{
 position:absolute;z-index:3;top:43%;width:23%;height:14%;
 background:linear-gradient(180deg,#536574,#18232e 42%,#080d14 70%,#536574);
 border:1px solid #718b9c77;border-radius:7px;
 box-shadow:inset 0 2px 3px #d9f0ff20,0 6px 12px #0009
}
.arm:before{
 content:"";position:absolute;top:23%;bottom:23%;left:12%;right:12%;
 border:1px solid #a0b5c34a;border-radius:3px;
 background:repeating-linear-gradient(90deg,transparent 0 6px,#91b0c322 7px 8px)
}
.arm.left{left:1%;transform:rotate(-12deg)}
.arm.right{right:1%;transform:rotate(12deg)}
.sensor{
 position:absolute;z-index:6;width:8%;height:8%;border-radius:50%;
 top:46%;background:radial-gradient(circle at 35% 30%,#e6fbff,#41a7df 38%,#0a1723 72%);
 border:2px solid #647d8f;box-shadow:0 0 13px #2eafff66
}
.sensor.left{left:20%}.sensor.right{right:20%}
.antenna{
 position:absolute;z-index:3;left:49%;top:13%;width:2%;height:13%;
 background:linear-gradient(90deg,#192630,#9cb6c7,#253440);
 border-radius:4px
}
.antenna:before{
 content:"";position:absolute;top:-8px;left:-5px;width:10px;height:10px;
 border-radius:50%;background:#72d9ff;border:1px solid #c0f1ff;
 box-shadow:0 0 12px #3db7ff
}
.foot{
 position:absolute;z-index:3;left:41%;bottom:14%;width:18%;height:9%;
 background:linear-gradient(#647987,#1a2631 45%,#080c12);
 border:1px solid #71889788;border-radius:4px;
 clip-path:polygon(12% 0,88% 0,100% 65%,80% 100%,20% 100%,0 65%)
}
.field{
 position:absolute;inset:0;z-index:1;border-radius:50%;
 background:radial-gradient(ellipse at center,transparent 38%,#258bd307 53%,transparent 70%);
}
.floor{
 position:absolute;bottom:19%;width:min(75vw,380px);height:30px;border-radius:50%;
 background:#1478ba24;filter:blur(13px)
}
.label{
 position:absolute;top:max(22px,env(safe-area-inset-top));width:100%;text-align:center;
 font-size:10px;letter-spacing:.32em;color:#91b5ca6e
}
.controls{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));display:flex;gap:10px}
button{
 border:1px solid #76bde65c;background:#08131edb;color:#cceeff;
 border-radius:22px;padding:11px 17px;font-size:11px;letter-spacing:.12em;
 text-transform:uppercase;backdrop-filter:blur(12px)
}
body.speaking .seam{height:3px;background:linear-gradient(90deg,transparent,#fff,#fff,transparent);box-shadow:0 0 10px #fff,0 0 30px #e5f8ff}
body.speaking .orbit{border-color:#c5efffbb}
body.speaking .sensor{background:radial-gradient(circle,#fff,#8ce2ff 40%,#10283b 75%);box-shadow:0 0 17px #dff8ff}
@keyframes spin{to{rotate:360deg}}
@keyframes reverse{to{rotate:-360deg}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}
@keyframes breath{0%,100%{opacity:.45;scale:.92}50%{opacity:.95;scale:1.08}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="stage">
 <div class="label">DANIKEAI · ADVANCED SYSTEM</div>
 <div class="ambient"></div><div class="floor"></div>
 <section class="unit" aria-label="Unidade esférica DaNikeAI">
  <div class="field"></div>
  <div class="orbit"></div><div class="orbit b"></div>
  <div class="orbit c"></div><div class="orbit d"></div>
  <div class="antenna"></div>
  <div class="arm left"></div><div class="arm right"></div>
  <div class="core"><div class="plate"></div></div>
  <div class="seam"></div>
  <div class="sensor left"></div><div class="sensor right"></div>
  <div class="foot"></div>
 </section>
 <div class="controls">
  <button id="idle">Repouso</button>
  <button id="talk">Simular fala</button>
 </div>
</main>
<script>
const talk=document.getElementById('talk');
const idle=document.getElementById('idle');
let timer;
function speaking(on){
 document.body.classList.toggle('speaking',on);
 clearTimeout(timer);
 if(on)timer=setTimeout(()=>speaking(false),4000);
}
talk.addEventListener('click',()=>speaking(true));
idle.addEventListener('click',()=>speaking(false));
document.querySelector('.unit').addEventListener('click',()=>speaking(true));
</script>
</body>
</html>
